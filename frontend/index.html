<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloud Splat — New capture</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <nav>
    <span class="brand">☁️ Cloud Splat</span>
    <a href="/" class="active">New capture</a>
    <a href="/gallery">Gallery</a>
  </nav>
  <main>
    <h1>Train a Gaussian splat</h1>
    <p class="sub">Upload an Insta360 capture (the <code>_00_</code> and <code>_10_</code> .insv files), pick a quality, and we'll spin up a GPU to build a viewable splat.</p>

    <form id="form" class="card">
      <label class="field">
        <span>Front camera file (contains <code>_00_</code>)</span>
        <input type="file" id="front" accept=".insv" required />
      </label>
      <label class="field">
        <span>Back camera file (contains <code>_10_</code>)</span>
        <input type="file" id="back" accept=".insv" required />
      </label>

      <label class="field">
        <span>Quality</span>
        <div class="presets" id="presets"></div>
      </label>

      <label class="field toggle">
        <input type="checkbox" id="masking" checked />
        <span style="margin:0;color:var(--text)">Mask people &amp; ground (recommended)</span>
      </label>

      <button type="submit" class="primary" id="submit">Start training</button>
      <div class="progress" id="progressbar" hidden><div></div></div>
      <div class="msg" id="msg"></div>
    </form>
  </main>
  <script type="module" src="/src/upload.js"></script>
</body>
</html>
